[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "like-bot-v2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "PyQt6>=6.7",
    "keyring>=25",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
build = ["pyinstaller>=6.10"]

[tool.setuptools]
packages = ["engine", "desktop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: 네이버에 실제 요청을 보내는 계약 테스트 (비로그인)",
    "browser: 로컬 브라우저 바이너리가 필요한 테스트 (playwright install chromium)",
]
addopts = "-m 'not contract and not browser'"
