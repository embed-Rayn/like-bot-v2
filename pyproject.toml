[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "like-bot-v2"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "PyQt6>=6.7",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
build = ["pyinstaller>=6.10"]

[tool.setuptools]
packages = ["engine", "desktop"]

# 버전은 engine/version.py 한 곳에서만 온다 — 창 제목과 exe 속성창도
# 같은 값을 읽는다.
[tool.setuptools.dynamic]
version = {attr = "engine.version.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: 네이버에 실제 요청을 보내는 계약 테스트 (비로그인)",
    "browser: 로컬 브라우저 바이너리가 필요한 테스트 (playwright install chromium)",
]
addopts = "-m 'not contract and not browser'"
